<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyfall Cache vs Scryfall</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg-2: #111827;
        --panel: #1a2434;
        --panel-2: #0f172a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --ok: #22c55e;
        --warn: #f59e0b;
        --error: #ef4444;
        --border: rgba(148, 163, 184, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .muted {
        color: var(--muted);
        font-size: 1.05rem;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      #run-all {
        background: var(--accent);
        color: #08111d;
      }

      #clear {
        background: rgba(148, 163, 184, 0.18);
        color: var(--text);
      }

      #output {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      details.endpoint-row {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.72);
        overflow: hidden;
      }

      details.endpoint-row summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 18px;
        font-weight: 800;
        font-size: 1.18rem;
        background: rgba(15, 23, 42, 0.8);
        user-select: none;
      }

      details.endpoint-row summary::-webkit-details-marker {
        display: none;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .status-pill.match {
        background: rgba(34, 197, 94, 0.2);
        color: var(--ok);
      }

      .status-pill.mismatch {
        background: rgba(239, 68, 68, 0.2);
        color: var(--error);
      }

      .compare-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px;
        background: rgba(15, 23, 42, 0.4);
      }

      .result-box {
        background: rgba(10, 15, 25, 0.9);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        min-height: 150px;
      }

      .result-box h4 {
        margin: 0 0 10px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.5;
        color: #dbeafe;
        background: transparent;
      }

      @media (max-width: 980px) {
        .compare-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Pyfall Cache vs Scryfall</h1>
      <div class="muted">
        Left side = your cache (https://scryfall.slutt.nu)<br />
        Right side = live upstream Scryfall (https://api.scryfall.com)
      </div>

      <div class="controls">
        <button id="run-all">Run all comparisons</button>
        <button id="clear">Clear</button>
      </div>

      <div id="output"></div>
    </div>

    <script>
      const CACHE_URL = "https://scryfall.slutt.nu";
      const UPSTREAM_URL = "https://api.scryfall.com";

      const output = document.getElementById("output");

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function pretty(value) {
        if (typeof value === "string") return value;
        return JSON.stringify(value, null, 2);
      }

      function deepEqual(a, b) {
        if (a === b) return true;
        if (a == null || b == null) return a === b;

        if (Array.isArray(a) && Array.isArray(b)) {
          if (a.length !== b.length) return false;
          for (let i = 0; i < a.length; i++) {
            if (!deepEqual(a[i], b[i])) return false;
          }
          return true;
        }

        if (typeof a === "object" && typeof b === "object") {
          const aKeys = Object.keys(a).sort();
          const bKeys = Object.keys(b).sort();
          if (aKeys.length !== bKeys.length) return false;

          for (const key of aKeys) {
            if (!deepEqual(a[key], b[key])) return false;
          }
          return true;
        }

        return false;
      }

      function normalizeResponse(value) {
        if (typeof value === "string") {
          try {
            return JSON.parse(value);
          } catch {
            return value;
          }
        }
        return value;
      }

      async function fetchJson(url, init = {}) {
        const res = await fetch(url, {
          ...init,
          headers: {
            Accept: "application/json",
            ...(init.headers || {})
          }
        });

        const text = await res.text();
        let payload = text;

        try {
          payload = JSON.parse(text);
        } catch {
          // keep raw text
        }

        return {
          ok: res.ok,
          status: res.status,
          statusText: res.statusText,
          redirected: res.redirected,
          url: res.url,
          payload: normalizeResponse(payload),
          rawText: text,
          headers: Object.fromEntries(res.headers.entries())
        };
      }

      function addComparisonRow(name, cacheResult, upstreamResult) {
        const details = document.createElement("details");
        details.className = "endpoint-row";
        details.open = true;

        const summary = document.createElement("summary");
        const match = cacheResult.ok && upstreamResult.ok && deepEqual(cacheResult.payload, upstreamResult.payload);
        const statusClass = match ? "match" : "mismatch";
        const statusLabel = match ? "✓ MATCH" : "✗ DIFFERENT";

        summary.innerHTML = `
          <span>${escapeHtml(name)}</span>
          <span class="status-pill ${statusClass}">${statusLabel}</span>
        `;

        const compareGrid = document.createElement("div");
        compareGrid.className = "compare-grid";

        const left = document.createElement("div");
        left.className = "result-box";
        left.innerHTML = `
          <h4>Cache</h4>
          <pre>${escapeHtml(pretty(cacheResult.payload))}</pre>
        `;

        const right = document.createElement("div");
        right.className = "result-box";
        right.innerHTML = `
          <h4>Upstream</h4>
          <pre>${escapeHtml(pretty(upstreamResult.payload))}</pre>
        `;

        compareGrid.appendChild(left);
        compareGrid.appendChild(right);

        details.appendChild(summary);
        details.appendChild(compareGrid);
        output.appendChild(details);
      }

      function clearOutput() {
        output.innerHTML = "";
      }

      async function runComparison(name, cachePath, upstreamPath) {
        let cacheResult;
        let upstreamResult;

        try {
          cacheResult = await fetchJson(`${CACHE_URL}${cachePath}`);
        } catch (err) {
          cacheResult = {
            ok: false,
            status: 0,
            statusText: "fetch error",
            payload: { error: String(err) }
          };
        }

        try {
          upstreamResult = await fetchJson(`${UPSTREAM_URL}${upstreamPath}`);
        } catch (err) {
          upstreamResult = {
            ok: false,
            status: 0,
            statusText: "fetch error",
            payload: { error: String(err) }
          };
        }

        addComparisonRow(name, cacheResult, upstreamResult);
      }

      async function runAllComparisons() {
        clearOutput();

        const tests = [
          ["GET /health", "/health", "/health"],
          ["GET /sets", "/sets", "/sets"],
          ["GET /cards/search?q=set:lea&unique=prints&limit=1", "/cards/search?q=set:lea&unique=prints&limit=1", "/cards/search?q=set:lea&unique=prints&limit=1"],
          ["GET /cards/named?exact=Dark+Ritual", "/cards/named?exact=Dark+Ritual", "/cards/named?exact=Dark+Ritual"],
          ["GET /cards/autocomplete?q=light", "/cards/autocomplete?q=light", "/cards/autocomplete?q=light"],
          ["GET /cards/random", "/cards/random", "/cards/random"],
          ["GET /cards/collection", "/cards/collection", "/cards/collection"],
          ["GET /cards/lea/161", "/cards/lea/161", "/cards/lea/161"],
          ["GET /cards/{id}", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a"],
          ["GET /cards/{id}/image", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a/image", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a/image"],
          ["GET /cards/{id}/art", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a/art", "/cards/d573ef03-4730-45aa-93dd-e45ac1dbaf4a/art"]
        ];

        for (const [label, cachePath, upstreamPath] of tests) {
          await runComparison(label, cachePath, upstreamPath);
        }
      }

      document.getElementById("run-all").addEventListener("click", runAllComparisons);
      document.getElementById("clear").addEventListener("click", clearOutput);

      clearOutput();
      const ready = document.createElement("div");
      ready.className = "endpoint-row";
      ready.innerHTML = `
        <details open>
          <summary>
            <span>Ready</span>
            <span class="status-pill warn">READY</span>
          </summary>
          <div class="compare-grid">
            <div class="result-box">
              <h4>Cache</h4>
              <pre>Click "Run all comparisons" to fetch responses and compare them.</pre>
            </div>
            <div class="result-box">
              <h4>Upstream</h4>
              <pre>Click "Run all comparisons" to fetch responses and compare them.</pre>
            </div>
          </div>
        </details>
      `;
      output.appendChild(ready);
    </script>
  </body>
</html>
