name: build

on:
  push:
    branches: [temp-remove-main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: sluttnu/common-workflows/.github/workflows/build.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
    with:
      app: scryfall-cache
      image: ghcr.io/sluttnu/scryfall-cache
      context: .
      dockerfile: Dockerfile
      dispatch_repo: sluttnu/sluttvps-docker
      dispatch_event_type: deploy
